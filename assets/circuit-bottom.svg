<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70" fill="none">
  <style>
    .c{stroke:#00e5ff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:.55}
    .v{stroke:#7c4dff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:.6}
    .p{stroke:#e6f1ff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:12 400;animation:flow 5s linear infinite}
    .p2{animation-delay:-2.5s}
    .n{fill:#05070f;stroke:#00e5ff;stroke-width:1.6}
    .nv{fill:#05070f;stroke:#7c4dff;stroke-width:1.6}
    .hub{fill:#00e5ff;opacity:.9;animation:blink 2.4s ease-in-out infinite}
    @keyframes flow{from{stroke-dashoffset:412}to{stroke-dashoffset:0}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <g transform="translate(0 70) scale(1 -1)">
