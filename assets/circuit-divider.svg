    .hub{fill:#00e5ff;animation:blink 2.4s ease-in-out infinite}
    @keyframes flow{from{stroke-dashoffset:310}to{stroke-dashoffset:0}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
