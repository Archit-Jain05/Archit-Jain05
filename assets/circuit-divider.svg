<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" fill="none">
  <style>
    .c{stroke:#00e5ff;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.5}
    .v{stroke:#7c4dff;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.6}
    .p{stroke:#e6f1ff;stroke-width:2;stroke-linecap:round;stroke-dasharray:10 300;animation:flow 4s linear infinite}
    .p2{animation-delay:-2s}
    .n{fill:#05070f;stroke:#00e5ff;stroke-width:1.5}
