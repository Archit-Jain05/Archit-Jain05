name: Generate Datas

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest

    steps:
      # Generate Snake Animation (green dark palette)
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Archit-Jain05
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2339d353&color_dots=%23161b22,%2301311f,%23034525,%230f6d31,%2300c647

      # Push to output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
